<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111418" />
    <title>Yard Master – HGV1 Radio</title>
    <link rel="stylesheet" href="./styles/theme.css" />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game" tabindex="0" aria-label="Yard Master game"></canvas>

      <div id="pause" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
        <div class="card">
          <h1 id="pause-title">Paused</h1>
          <button id="resume" class="btn primary" type="button">Resume</button>
          <button id="restart" class="btn" type="button">Restart</button>
        </div>
      </div>

      <div id="results" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="note-title">
        <div class="note">
          <section class="note-paper">
            <header class="note-head">
              <div class="logo-slot" id="note-logo">LOGO</div>
              <div class="note-head-text">
                <h1 id="note-title">Delivery note</h1>
                <p class="note-no"><span id="note-no"></span> · <span id="note-date"></span></p>
              </div>
            </header>
            <p class="note-summary" id="note-summary"></p>
            <table class="note-table">
              <tbody>
                <tr><th scope="row">Consignor</th><td id="note-consignor"></td></tr>
                <tr><th scope="row">Delivery point</th><td id="note-point"></td></tr>
                <tr><th scope="row">Driving time</th><td id="note-time"></td></tr>
                <tr><th scope="row">Contacts</th><td id="note-contacts"></td></tr>
                <tr><th scope="row">Total time</th><td id="note-total"></td></tr>
                <tr><th scope="row">Shunts</th><td id="note-shunts"></td></tr>
                <tr><th scope="row">Best on this bay</th><td id="note-best"></td></tr>
              </tbody>
            </table>
            <div class="note-foot">
              <div class="note-stars" id="note-stars" aria-label=""></div>
              <div class="stamp">Delivered</div>
            </div>
            <p class="note-sign">Received in good order: <span class="sign-line"></span></p>
          </section>
          <section class="note-share">
            <img id="share-preview" alt="Your share card" width="1080" height="1080" />
            <div class="note-actions">
              <button id="btn-share" class="btn primary" type="button">Share</button>
              <button id="btn-download" class="btn" type="button">Download image</button>
              <button id="btn-copy" class="btn" type="button">Copy text</button>
              <button id="btn-again" class="btn" type="button">Drive again</button>
            </div>
            <p class="note-msg" id="share-msg" aria-live="polite"></p>
          </section>
        </div>
      </div>

      <div id="fail" class="overlay hidden" role="alertdialog" aria-modal="true" aria-labelledby="fail-title">
        <div class="card fail-card">
          <h1 id="fail-title">Jackknifed</h1>
          <p id="fail-reason"></p>
          <button id="btn-retry" class="btn primary" type="button">Try again</button>
        </div>
      </div>

      <div id="focus-hint" class="hint hidden">Click or tap the yard to take control</div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
